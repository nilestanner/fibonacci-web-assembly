name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # No `npm ci`: the tests have no npm dependencies and run against the committed
      # out/main.wasm. The only devDependency is AssemblyScript from GitHub master (a 2018
      # snapshot in the lockfile), which is not used here.
      - run: npm test
